<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mapa de Lotes Zafra 2025 – Ingenio La Esperanza</title>
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    crossorigin=""
  />
  <style>
    :root {
      --bg: #0f172a;
      --panel: #ffffff;
      --panel-alt: #f8fafc;
      --border: #e2e8f0;
      --text: #0f172a;
      --muted: #64748b;
      --accent: #15803d;
      --accent-soft: #dcfce7;
      --shadow: 0 4px 18px rgba(15, 23, 42, 0.14);
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, sans-serif;
      color: var(--text);
      background: var(--bg);
      overflow: hidden;
    }

    .app-shell {
      display: flex;
      height: 100vh;
      width: 100vw;
      position: relative;
    }

    .sidebar {
      width: 390px;
      min-width: 340px;
      max-width: 92vw;
      height: 100%;
      background: var(--panel);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      z-index: 900;
      box-shadow: var(--shadow);
      transition: margin-left 0.22s ease;
    }

    .sidebar.collapsed {
      margin-left: -390px;
    }

    .sidebar-header {
      padding: 14px 16px 12px;
      background: linear-gradient(135deg, #14532d 0%, #166534 65%, #15803d 100%);
      color: #ffffff;
    }

    .sidebar-header h1 {
      margin: 0;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .sidebar-header p {
      margin: 4px 0 0;
      font-size: 12px;
      color: #dcfce7;
    }

    .controls {
      padding: 12px 14px;
      background: var(--panel-alt);
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    .control-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .field label {
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    .field select,
    .field input {
      width: 100%;
      padding: 6px 8px;
      font-size: 13px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      background: #ffffff;
      color: var(--text);
      outline: none;
    }

    .field select:focus,
    .field input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(21, 128, 61, 0.16);
    }

    .search-wrap {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .btn {
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 600;
      border-radius: 6px;
      border: 1px solid #cbd5e1;
      background: #ffffff;
      color: var(--text);
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s ease, border-color 0.15s ease;
    }

    .btn:hover {
      background: #f1f5f9;
      border-color: #94a3b8;
    }

    .btn-primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #ffffff;
    }

    .btn-primary:hover {
      background: #166534;
      border-color: #166534;
    }

    .toggles-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 5px 10px;
      padding-top: 2px;
    }

    .toggle-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: #334155;
      cursor: pointer;
      user-select: none;
    }

    .toggle-item input {
      accent-color: var(--accent);
      cursor: pointer;
      margin: 0;
    }

    .actions-bar {
      display: flex;
      gap: 6px;
      align-items: center;
      justify-content: space-between;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      background: #ffffff;
    }

    .stat-card {
      background: var(--panel-alt);
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 6px 8px;
      text-align: center;
    }

    .stat-value {
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
    }

    .stat-label {
      font-size: 10.5px;
      color: var(--muted);
      margin-top: 1px;
    }

    .legend-box {
      padding: 8px 14px;
      border-bottom: 1px solid var(--border);
      background: #ffffff;
    }

    .legend-title {
      font-size: 11px;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.03em;
      margin-bottom: 6px;
    }

    .legend-items {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 10px;
    }

    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11.5px;
      color: #334155;
    }

    .legend-swatch {
      width: 11px;
      height: 11px;
      border-radius: 3px;
      border: 1px solid rgba(15, 23, 42, 0.28);
      flex-shrink: 0;
    }

    .lot-list-header {
      padding: 7px 14px;
      font-size: 11px;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.03em;
      background: var(--panel-alt);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
    }

    .lot-list {
      flex: 1;
      overflow-y: auto;
      background: #ffffff;
    }

    .lot-row {
      padding: 8px 14px;
      border-bottom: 1px solid #f1f5f9;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: background 0.12s ease;
    }

    .lot-row:hover {
      background: #f8fafc;
    }

    .lot-row.active {
      background: var(--accent-soft);
    }

    .lot-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
      border: 1px solid rgba(15, 23, 42, 0.3);
    }

    .lot-main {
      flex: 1;
      min-width: 0;
    }

    .lot-name {
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .lot-sub {
      font-size: 11.5px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .lot-metrics {
      text-align: right;
      font-size: 11.5px;
      color: #334155;
      flex-shrink: 0;
    }

    .lot-metrics strong {
      display: block;
      font-size: 12px;
    }

    .empty-state {
      padding: 28px 18px;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
    }

    .map-wrap {
      flex: 1;
      height: 100%;
      position: relative;
    }

    #map {
      width: 100%;
      height: 100%;
    }

    .sidebar-toggle {
      position: absolute;
      top: 12px;
      left: 12px;
      z-index: 950;
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      padding: 7px 11px;
      font-size: 12.5px;
      font-weight: 600;
      color: var(--text);
      cursor: pointer;
      box-shadow: 0 2px 10px rgba(15, 23, 42, 0.2);
    }

    .sidebar-toggle:hover {
      background: #f8fafc;
    }

    .ile-badge {
      background: #dc2626;
      color: #ffffff;
      border: 2px solid #ffffff;
      border-radius: 999px;
      font-weight: 800;
      font-size: 11px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
    }

    .finca-badge {
      background: #0f172a;
      color: #ffffff;
      border: 2px solid #ffffff;
      border-radius: 6px;
      padding: 2px 6px;
      font-size: 10.5px;
      font-weight: 700;
      white-space: nowrap;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
    }

    .ring-label {
      background: rgba(15, 23, 42, 0.78);
      color: #f8fafc;
      border: 1px solid rgba(255, 255, 255, 0.35);
      border-radius: 999px;
      padding: 2px 7px;
      font-size: 10.5px;
      font-weight: 600;
      white-space: nowrap;
    }

    .popup-card {
      font-size: 12.5px;
      line-height: 1.4;
      min-width: 245px;
    }

    .popup-title {
      font-size: 14px;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 2px;
    }

    .popup-sub {
      font-size: 11.5px;
      color: #475569;
      margin-bottom: 8px;
      padding-bottom: 6px;
      border-bottom: 1px solid #e2e8f0;
    }

    .popup-grid {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 3px 10px;
      margin-bottom: 9px;
    }

    .popup-grid span.k {
      color: #64748b;
      font-weight: 600;
    }

    .popup-grid span.v {
      color: #0f172a;
      text-align: right;
    }

    .gmaps-link {
      display: inline-block;
      width: 100%;
      text-align: center;
      padding: 6px 10px;
      background: #15803d;
      color: #ffffff !important;
      text-decoration: none;
      border-radius: 6px;
      font-weight: 600;
      font-size: 12px;
    }

    .gmaps-link:hover {
      background: #166534;
    }

    @media (max-width: 768px) {
      .sidebar {
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        width: 330px;
      }
      .sidebar.collapsed {
        margin-left: -330px;
      }
    }
  </style>
</head>

  <div class="app-shell">
    <aside id="sidebar" class="sidebar">
      <header class="sidebar-header">
        <h1>Visor de Lotes · Zafra 2025</h1>
        <p>Ingenio La Esperanza (219 lotes únicos · coordenadas aproximadas)</p>

      <section class="controls">
        <div class="control-row">
          <div class="field">
            <label for="colorMode">Colorear por</label>

              <option value="finca">Finca</option>
              <option value="zona">Zona de distancia</option>
              <option value="tipo">Tipo de cultivo</option>
              <option value="estado">Estado / Variedad</option>
            </select>
          </div>
          <div class="field">
            <label for="filterFinca">Finca</label>
            <select id="filterFinca">
              <option value="ALL">Todas (5)</option>
            </select>
          </div>
        </div>

        <div class="control-row">
          <div class="field">
            <label for="filterZona">Zona de distancia</label>
            <select id="filterZona">
              <option value="ALL">Todas</option>
              <option value="Cercana">Cercana (1–6 km)</option>
              <option value="Media">Media (7–12 km)</option>
              <option value="Lejana">Lejana (13–19 km)</option>
              <option value="Estimada">Estimada (sin DIST ILE)</option>
            </select>
          </div>
          <div class="field">
            <label for="filterTipo">Tipo de cultivo</label>
            <select id="filterTipo">
              <option value="ALL">Todos</option>
              <option value="Convencional">Convencional</option>
              <option value="Organico Full">Orgánico Full</option>
              <option value="Organico NOP">Orgánico NOP</option>
            </select>
          </div>
        </div>

        <div class="field">
          <label for="searchInput">Buscar lote, ID o variedad</label>
          <div class="search-wrap">
            <input
              id="searchInput"
              type="text"
              placeholder="Ej: Cienaga, Londres, 3201170, LCP 85..."
            />
            <button id="btnClear" class="btn" type="button" title="Limpiar filtros">Limpiar</button>
          </div>
        </div>

        <div class="toggles-grid">
          <label class="toggle-item">
            <input type="checkbox" id="togglePolygons" checked />
            Polígonos aproximados
          </label>
          <label class="toggle-item">
            <input type="checkbox" id="toggleCentroids" checked />
            Centroides de lotes
          </label>
          <label class="toggle-item">
            <input type="checkbox" id="toggleCabeceras" checked />
            Cabeceras de finca
          </label>
          <label class="toggle-item">
            <input type="checkbox" id="toggleRings" checked />
            Anillos 6 / 12 / 19 km
          </label>
        </div>

        <div class="actions-bar">
          <span id="filterNotice" style="font-size: 11.5px; color: #64748b;">
            Coordenadas estimadas por rumbo y DIST ILE
          </span>
          <button id="btnFit" class="btn btn-primary" type="button">Ajustar vista</button>
        </div>
      </section>

      <section class="stats-grid">
        <div class="stat-card">
          <div id="statCount" class="stat-value">0</div>
          <div class="stat-label">Lotes visibles</div>
        </div>
        <div class="stat-card">
          <div id="statAreaB" class="stat-value">0 ha</div>
          <div class="stat-label">Sup. Bruta</div>
        </div>
        <div class="stat-card">
          <div id="statAreaN" class="stat-value">0 ha</div>
          <div class="stat-label">Sup. Neta</div>
        </div>
      </section>

      <section class="legend-box">
        <div id="legendTitle" class="legend-title">Leyenda</div>
        <div id="legendItems" class="legend-items"></div>
      </section>

      <div class="lot-list-header">
        <span>Listado de lotes</span>
        <span id="listCountLabel">0</span>
      </div>
      <div id="lotList" class="lot-list"></div>
    </aside>

    <main class="map-wrap">
      <button id="sidebarToggle" class="sidebar-toggle" type="button">◀ Ocultar panel</button>
      <div id="map"></div>
    </main>
  </div>

  <script>
    (function () {
      const data = JSON.parse(document.getElementById("zafra-data").textContent);
      const ingenio = data.ingenio;
      const fincas = data.fincas;
      const lotes = data.lotes;

      const PALETTES = {
        finca: {
          title: "Color por Finca",
          items: [
            { key: "310", label: "El Quemado (310)", color: "#2563eb" },
            { key: "320", label: "Parapeti (320)", color: "#16a34a" },
            { key: "330", label: "Miraflores (330)", color: "#ea580c" },
            { key: "340", label: "San Antonio (340)", color: "#9333ea" },
            { key: "350", label: "Meguida (350)", color: "#64748b" },
          ],
        },
        zona: {
          title: "Color por Zona de distancia",
          items: [
            { key: "Cercana", label: "Cercana (1–6 km)", color: "#16a34a" },
            { key: "Media", label: "Media (7–12 km)", color: "#eab308" },
            { key: "Lejana", label: "Lejana (13–19 km)", color: "#dc2626" },
            { key: "Estimada", label: "Estimada (sin DIST ILE)", color: "#64748b" },
          ],
        },
        tipo: {
          title: "Color por Tipo de cultivo",
          items: [
            { key: "Convencional", label: "Convencional", color: "#0284c7" },
            { key: "Organico Full", label: "Orgánico Full", color: "#15803d" },
            { key: "Organico NOP", label: "Orgánico NOP", color: "#65a30d" },
          ],
        },
        estado: {
          title: "Color por Estado / Variedad",
          items: [
            { key: "En produccion", label: "En producción", color: "#15803d" },
            { key: "Descepe 2024", label: "Descepe 2024", color: "#d97706" },
            { key: "Vacio", label: "Vacío", color: "#64748b" },
            { key: "Monte", label: "Monte", color: "#78350f" },
          ],
        },
      };

      const FINCA_COLORS = {
        "310": "#2563eb",
        "320": "#16a34a",
        "330": "#ea580c",
        "340": "#9333ea",
        "350": "#64748b",
      };

      function escapeHtml(val) {
        if (val === null || val === undefined) return "";
        return String(val)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      function normalizeSearch(val) {
        return String(val || "")
          .replace(/\ufffd/g, "n")
          .normalize("NFD")
          .replace(/[\u0300-\u036f]/g, "")
          .toLowerCase();
      }

      function displayName(val) {
        return String(val || "").replace(/\ufffd/g, "ñ");
      }

      function getZona(lote) {
        if (lote.DIST_ILE_ESTIMADA || lote["DIST ILE"] === null || lote["DIST ILE"] === undefined) {
          return "Estimada";
        }
        const d = Number(lote["DIST ILE"]);
        if (d <= 6) return "Cercana";
        if (d <= 12) return "Media";
        return "Lejana";
      }

      function getEstadoVariedad(lote) {
        const v = (lote.VARIEDAD || "").trim().toLowerCase();
        if (v === "descepe 2024") return "Descepe 2024";
        if (v === "vacio") return "Vacio";
        if (v === "monte" || (!v && String(lote.LOTE || "").toLowerCase().startsWith("monte"))) {
          return "Monte";
        }
        return "En produccion";
      }

      function getEstadoLabel(code) {
        if (code === "En produccion") return "En producción";
        if (code === "Vacio") return "Vacío";
        return code;
      }

      function getLotColor(lote, mode) {
        const group = PALETTES[mode];
        let key;
        if (mode === "finca") key = lote.ID_FINCA;
        else if (mode === "zona") key = getZona(lote);
        else if (mode === "tipo") key = lote.Tipo;
        else key = getEstadoVariedad(lote);

        const found = group.items.find((it) => it.key === key);
        return found ? found.color : "#334155";
      }

      function formatHa(num) {
        return Number(num || 0).toLocaleString("es-AR", {
          minimumFractionDigits: 1,
          maximumFractionDigits: 1,
        }) + " ha";
      }

      function buildPopupHtml(lote) {
        const zona = getZona(lote);
        const estado = getEstadoLabel(getEstadoVariedad(lote));
        const distIleText = lote["DIST ILE"] !== null && lote["DIST ILE"] !== undefined
          ? escapeHtml(lote["DIST ILE"]) + " km"
          : "Sin dato (est. " + escapeHtml(lote.DIST_CALCULADA_KM) + " km)";
        const areaNText = lote.AREA_N !== null && lote.AREA_N !== undefined
          ? escapeHtml(lote.AREA_N) + " ha"
          : "—";
        const variedadText = lote.VARIEDAD ? escapeHtml(lote.VARIEDAD) : "Sin dato";
        const surcosText = lote.SURCOS ? escapeHtml(lote.SURCOS) : "—";
        const plantText = lote.PLANT ? escapeHtml(lote.PLANT) : "—";
        const oiaText = lote.ID_OIA ? " · OIA " + escapeHtml(lote.ID_OIA) : "";
        const gmapsUrl = "https://www.google.com/maps?q=" + lote.LATITUD + "," + lote.LONGITUD;

        return `
          <div class="popup-card">
            <div class="popup-title">${escapeHtml(displayName(lote.LOTE))}</div>
            <div class="popup-sub">
              <strong>${escapeHtml(lote.FINCA)}</strong> (${escapeHtml(lote.ID_FINCA)}) ·
              ID ${escapeHtml(lote.ID_UNICO)} · Lote ${escapeHtml(lote.ID_LOTE)}${oiaText}
            </div>
            <div class="popup-grid">
              <span class="k">Tipo cultivo:</span><span class="v">${escapeHtml(lote.Tipo)}</span>
              <span class="k">Variedad / Estado:</span><span class="v">${variedadText} (${escapeHtml(estado)})</span>
              <span class="k">Sup. Bruta / Neta:</span><span class="v">${escapeHtml(lote.AREA_B)} ha / ${areaNText}</span>
              <span class="k">Surcos / Plant.:</span><span class="v">${surcosText} / ${plantText}</span>
              <span class="k">DIST ILE (Zona):</span><span class="v">${distIleText} (${escapeHtml(zona)})</span>
              <span class="k">Dist. calculada:</span><span class="v">${escapeHtml(lote.DIST_CALCULADA_KM)} km</span>
              <span class="k">Acimut / Rumbo:</span><span class="v">${escapeHtml(lote.ACIMUT_GRADOS)}° (${escapeHtml(lote.RUMBO_CARDINAL)})</span>
              <span class="k">Coordenadas:</span><span class="v">${lote.LATITUD.toFixed(6)}, ${lote.LONGITUD.toFixed(6)}</span>
            </div>
            <a class="gmaps-link" href="${gmapsUrl}" target="_blank" rel="noopener noreferrer">
              Abrir en Google Maps
            </a>
          </div>
        `;
      }

      // Inicializar mapa
      const map = L.map("map", {
        center: [ingenio.latitud, ingenio.longitud],
        zoom: 12,
        zoomControl: false,
      });
      L.control.zoom({ position: "bottomright" }).addTo(map);

      const baseSatelite = L.tileLayer(
        "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
        {
          attribution: "Tiles &copy; Esri — Source: Esri, Maxar, Earthstar Geographics",
          maxZoom: 19,
        }
      );

      const baseOSM = L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
        attribution: "&copy; OpenStreetMap contributors",
        maxZoom: 19,
      });

      const baseTopo = L.tileLayer("https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png", {
        attribution: "Map data: &copy; OpenStreetMap, SRTM | Style: &copy; OpenTopoMap",
        maxZoom: 17,
      });

      baseSatelite.addTo(map);
      L.control.layers(
        {
          "Satélite (Esri)": baseSatelite,
          "Callejero (OpenStreetMap)": baseOSM,
          "Topográfico (OpenTopoMap)": baseTopo,
        },
        null,
        { position: "topright" }
      ).addTo(map);

      // Capa de anillos de distancia
      const ringsLayer = L.layerGroup().addTo(map);
      for (let km = 1; km <= 19; km++) {
        const isZoneBoundary = km === 6 || km === 12 || km === 19;
        L.circle([ingenio.latitud, ingenio.longitud], {
          radius: km * 1000,
          color: isZoneBoundary ? "#f8fafc" : "rgba(248, 250, 252, 0.35)",
          weight: isZoneBoundary ? 2 : 1,
          dashArray: isZoneBoundary ? "6 5" : "2 6",
          fill: false,
          interactive: false,
        }).addTo(ringsLayer);
      }

      const zoneRingLabels = [
        { km: 6, text: "6 km · Cercana" },
        { km: 12, text: "12 km · Media" },
        { km: 19, text: "19 km · Lejana" },
      ];
      zoneRingLabels.forEach((z) => {
        const lat = ingenio.latitud - (z.km / 110.758);
        L.marker([lat, ingenio.longitud], {
          interactive: false,
          icon: L.divIcon({
            className: "",
            html: `<div class="ring-label">${escapeHtml(z.text)}</div>`,
            iconSize: [110, 20],
            iconAnchor: [55, 10],
          }),
        }).addTo(ringsLayer);
      });

      // Marcador del Ingenio La Esperanza
      const ileMarker = L.marker([ingenio.latitud, ingenio.longitud], {
        zIndexOffset: 1000,
        icon: L.divIcon({
          className: "",
          html: '<div class="ile-badge" style="width:34px;height:34px;">ILE</div>',
          iconSize: [34, 34],
          iconAnchor: [17, 17],
        }),
      }).addTo(map);

      ileMarker.bindTooltip("Ingenio La Esperanza (Origen)", { direction: "top" });
      ileMarker.bindPopup(`
        <div class="popup-card">
          <div class="popup-title">${escapeHtml(ingenio.nombre)}</div>
          <div class="popup-sub">Punto de origen de distancias (ILE)</div>
          <div class="popup-grid">
            <span class="k">Latitud:</span><span class="v">${ingenio.latitud}</span>
            <span class="k">Longitud:</span><span class="v">${ingenio.longitud}</span>
            <span class="k">Fincas:</span><span class="v">${fincas.length}</span>
            <span class="k">Lotes únicos:</span><span class="v">${lotes.length}</span>
          </div>
          <a class="gmaps-link" href="https://www.google.com/maps?q=${ingenio.latitud},${ingenio.longitud}" target="_blank" rel="noopener noreferrer">
            Abrir en Google Maps
          </a>
        </div>
      `);

      // Capa de cabeceras de fincas
      const cabecerasLayer = L.layerGroup().addTo(map);
      fincas.forEach((f) => {
        const color = FINCA_COLORS[f.id_finca] || "#0f172a";
        const m = L.marker([f.latitud_cabecera, f.longitud_cabecera], {
          zIndexOffset: 600,
          icon: L.divIcon({
            className: "",
            html: `<div class="finca-badge" style="border-color:${color};">${escapeHtml(f.nombre)}</div>`,
            iconSize: [110, 22],
            iconAnchor: [55, 11],
          }),
        }).addTo(cabecerasLayer);

        const rangoIle = f.rango_dist_ile_km
          ? `${f.rango_dist_ile_km[0]} – ${f.rango_dist_ile_km[1]} km`
          : "Sin DIST ILE (estimada)";
        m.bindPopup(`
          <div class="popup-card">
            <div class="popup-title">Cabecera Finca ${escapeHtml(f.nombre)} (${escapeHtml(f.id_finca)})</div>
            <div class="popup-sub">${escapeHtml(f.referencia_cabecera)}</div>
            <div class="popup-grid">
              <span class="k">Lotes únicos:</span><span class="v">${escapeHtml(f.cantidad_lotes)}</span>
              <span class="k">Sup. Bruta total:</span><span class="v">${formatHa(f.area_bruta_total_ha)}</span>
              <span class="k">Sector acimut:</span><span class="v">${escapeHtml(f.sector_acimut_grados[0])}° – ${escapeHtml(f.sector_acimut_grados[1])}° (${escapeHtml(f.rumbo)})</span>
              <span class="k">Rango DIST ILE:</span><span class="v">${escapeHtml(rangoIle)}</span>
              <span class="k">Cruza Ruta 34:</span><span class="v">${f.cruza_ruta_34 ? "Sí" : "No"}</span>
              <span class="k">Crítica drenaje:</span><span class="v">${f.critica_drenaje ? "Sí" : "No"}</span>
            </div>
          </div>
        `);
      });

      // Capas de polígonos y centroides
      const polygonsLayer = L.layerGroup().addTo(map);
      const centroidsLayer = L.layerGroup().addTo(map);

      // Referencias DOM
      const elColorMode = document.getElementById("colorMode");
      const elFilterFinca = document.getElementById("filterFinca");
      const elFilterZona = document.getElementById("filterZona");
      const elFilterTipo = document.getElementById("filterTipo");
      const elSearchInput = document.getElementById("searchInput");
      const elBtnClear = document.getElementById("btnClear");
      const elBtnFit = document.getElementById("btnFit");
      const elTogglePolygons = document.getElementById("togglePolygons");
      const elToggleCentroids = document.getElementById("toggleCentroids");
      const elToggleCabeceras = document.getElementById("toggleCabeceras");
      const elToggleRings = document.getElementById("toggleRings");
      const elStatCount = document.getElementById("statCount");
      const elStatAreaB = document.getElementById("statAreaB");
      const elStatAreaN = document.getElementById("statAreaN");
      const elLegendTitle = document.getElementById("legendTitle");
      const elLegendItems = document.getElementById("legendItems");
      const elListCountLabel = document.getElementById("listCountLabel");
      const elLotList = document.getElementById("lotList");
      const elSidebar = document.getElementById("sidebar");
      const elSidebarToggle = document.getElementById("sidebarToggle");

      // Poblar selector de fincas
      fincas.forEach((f) => {
        const opt = document.createElement("option");
        opt.value = f.id_finca;
        opt.textContent = `${f.nombre} (${f.id_finca}) · ${f.cantidad_lotes}`;
        elFilterFinca.appendChild(opt);
      });

      // Estado activo
      let activeLotId = null;
      let filteredLots = [];
      const layerLookup = new Map();

      function renderLegend() {
        const mode = elColorMode.value;
        const spec = PALETTES[mode];
        elLegendTitle.textContent = spec.title;
        elLegendItems.innerHTML = spec.items
          .map(
            (it) => `
            <span class="legend-item">
              <span class="legend-swatch" style="background:${it.color};"></span>
              ${escapeHtml(it.label)}
            </span>`
          )
          .join("");
      }

      function applyFilters() {
        const fincaVal = elFilterFinca.value;
        const zonaVal = elFilterZona.value;
        const tipoVal = elFilterTipo.value;
        const q = normalizeSearch(elSearchInput.value.trim());

        filteredLots = lotes.filter((lote) => {
          if (fincaVal !== "ALL" && lote.ID_FINCA !== fincaVal) return false;
          if (zonaVal !== "ALL" && getZona(lote) !== zonaVal) return false;
          if (tipoVal !== "ALL" && lote.Tipo !== tipoVal) return false;
          if (q) {
            const hay =
              normalizeSearch(lote.LOTE).includes(q) ||
              normalizeSearch(lote.ID_UNICO).includes(q) ||
              normalizeSearch(lote.ID_LOTE).includes(q) ||
              normalizeSearch(lote.VARIEDAD).includes(q) ||
              normalizeSearch(lote.FINCA).includes(q);
            if (!hay) return false;
          }
          return true;
        });

        renderMapLots();
        renderStatsAndList();
      }

      function renderMapLots() {
        polygonsLayer.clearLayers();
        centroidsLayer.clearLayers();
        layerLookup.clear();

        const mode = elColorMode.value;

        filteredLots.forEach((lote) => {
          const color = getLotColor(lote, mode);
          const popupHtml = buildPopupHtml(lote);
          const tooltipHtml = `<strong>${escapeHtml(displayName(lote.LOTE))}</strong> · ${escapeHtml(lote.FINCA)} · ${escapeHtml(lote.DIST_CALCULADA_KM)} km`;

          const poly = L.polygon(lote.POLIGONO_APROX, {
            color: color,
            weight: 1.5,
            opacity: 0.9,
            fillColor: color,
            fillOpacity: 0.34,
          });
          poly.bindTooltip(tooltipHtml, { sticky: true });
          poly.bindPopup(popupHtml, { maxWidth: 320 });
          poly.on("mouseover", () => poly.setStyle({ weight: 2.5, fillOpacity: 0.52 }));
          poly.on("mouseout", () => poly.setStyle({ weight: 1.5, fillOpacity: 0.34 }));
          poly.on("click", () => highlightListItem(lote.ID_UNICO));
          poly.addTo(polygonsLayer);

          const marker = L.circleMarker([lote.LATITUD, lote.LONGITUD], {
            radius: 5,
            color: "#ffffff",
            weight: 1.4,
            fillColor: color,
            fillOpacity: 0.95,
          });
          marker.bindTooltip(tooltipHtml, { direction: "top" });
          marker.bindPopup(popupHtml, { maxWidth: 320 });
          marker.on("click", () => highlightListItem(lote.ID_UNICO));
          marker.addTo(centroidsLayer);

          layerLookup.set(lote.ID_UNICO, { poly, marker, lote });
        });
      }

      function renderStatsAndList() {
        let sumB = 0;
        let sumN = 0;
        filteredLots.forEach((l) => {
          sumB += Number(l.AREA_B || 0);
          if (l.AREA_N !== null && l.AREA_N !== undefined) {
            sumN += Number(l.AREA_N);
          }
        });

        elStatCount.textContent = `${filteredLots.length} / ${lotes.length}`;
        elStatAreaB.textContent = formatHa(sumB);
        elStatAreaN.textContent = formatHa(sumN);
        elListCountLabel.textContent = `${filteredLots.length} lotes`;

        if (filteredLots.length === 0) {
          elLotList.innerHTML = '<div class="empty-state">No hay lotes que coincidan con los filtros actuales.</div>';
          return;
        }

        const mode = elColorMode.value;
        elLotList.innerHTML = filteredLots
          .map((l) => {
            const color = getLotColor(l, mode);
            const isActive = l.ID_UNICO === activeLotId ? " active" : "";
            const distText = l["DIST ILE"] !== null && l["DIST ILE"] !== undefined
              ? `${l["DIST ILE"]} km`
              : `~${l.DIST_CALCULADA_KM} km`;
            const varText = l.VARIEDAD ? l.VARIEDAD : "Monte / s/d";

            return `
              <div class="lot-row${isActive}" data-id="${escapeHtml(l.ID_UNICO)}">
                <span class="lot-dot" style="background:${color};"></span>
                <div class="lot-main">
                  <div class="lot-name">${escapeHtml(displayName(l.LOTE))}</div>
                  <div class="lot-sub">${escapeHtml(l.FINCA)} · ${escapeHtml(l.ID_UNICO)} · ${escapeHtml(varText)}</div>
                </div>
                <div class="lot-metrics">
                  <strong>${escapeHtml(distText)}</strong>
                  <span>${escapeHtml(l.AREA_B)} ha</span>
                </div>
              </div>`;
          })
          .join("");
      }

      function highlightListItem(uid) {
        activeLotId = uid;
        const rows = elLotList.querySelectorAll(".lot-row");
        rows.forEach((row) => {
          const match = row.getAttribute("data-id") === uid;
          row.classList.toggle("active", match);
          if (match) {
            row.scrollIntoView({ block: "nearest", behavior: "smooth" });
          }
        });
      }

      function focusLot(uid) {
        const entry = layerLookup.get(uid);
        if (!entry) return;
        highlightListItem(uid);
        const target = [entry.lote.LATITUD, entry.lote.LONGITUD];
        map.setView(target, Math.max(map.getZoom(), 14), { animate: false });

        if (elToggleCentroids.checked && map.hasLayer(centroidsLayer)) {
          entry.marker.openPopup();
        } else if (elTogglePolygons.checked && map.hasLayer(polygonsLayer)) {
          entry.poly.openPopup(target);
        } else {
          L.popup({ maxWidth: 320 })
            .setLatLng(target)
            .setContent(buildPopupHtml(entry.lote))
            .openOn(map);
        }
      }

      function fitVisibleBounds() {
        const pts = [[ingenio.latitud, ingenio.longitud]];
        const source = filteredLots.length > 0 ? filteredLots : lotes;
        source.forEach((l) => pts.push([l.LATITUD, l.LONGITUD]));
        map.fitBounds(L.latLngBounds(pts), { padding: [36, 36] });
      }

      function syncLayerVisibility() {
        if (elTogglePolygons.checked) {
          if (!map.hasLayer(polygonsLayer)) map.addLayer(polygonsLayer);
        } else {
          map.removeLayer(polygonsLayer);
        }

        if (elToggleCentroids.checked) {
          if (!map.hasLayer(centroidsLayer)) map.addLayer(centroidsLayer);
        } else {
          map.removeLayer(centroidsLayer);
        }

        if (elToggleCabeceras.checked) {
          if (!map.hasLayer(cabecerasLayer)) map.addLayer(cabecerasLayer);
        } else {
          map.removeLayer(cabecerasLayer);
        }

        if (elToggleRings.checked) {
          if (!map.hasLayer(ringsLayer)) map.addLayer(ringsLayer);
        } else {
          map.removeLayer(ringsLayer);
        }
      }

      // Eventos
      elColorMode.addEventListener("change", () => {
        renderLegend();
        renderMapLots();
        renderStatsAndList();
      });

      elFilterFinca.addEventListener("change", applyFilters);
      elFilterZona.addEventListener("change", applyFilters);
      elFilterTipo.addEventListener("change", applyFilters);
      elSearchInput.addEventListener("input", applyFilters);

      elBtnClear.addEventListener("click", () => {
        elFilterFinca.value = "ALL";
        elFilterZona.value = "ALL";
        elFilterTipo.value = "ALL";
        elSearchInput.value = "";
        activeLotId = null;
        applyFilters();
        fitVisibleBounds();
      });

      elBtnFit.addEventListener("click", fitVisibleBounds);
      elTogglePolygons.addEventListener("change", syncLayerVisibility);
      elToggleCentroids.addEventListener("change", syncLayerVisibility);
      elToggleCabeceras.addEventListener("change", syncLayerVisibility);
      elToggleRings.addEventListener("change", syncLayerVisibility);

      elLotList.addEventListener("click", (ev) => {
        const row = ev.target.closest(".lot-row");
        if (!row) return;
        focusLot(row.getAttribute("data-id"));
      });

      elSidebarToggle.addEventListener("click", () => {
        const collapsed = elSidebar.classList.toggle("collapsed");
        elSidebarToggle.textContent = collapsed ? "▶ Mostrar panel" : "◀ Ocultar panel";
        setTimeout(() => map.invalidateSize(), 240);
      });

      // Arranque inicial
      renderLegend();
      applyFilters();
      fitVisibleBounds();
    })();
  </script>
</body>
</html>
